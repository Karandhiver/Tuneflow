<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fc3c44"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- Perfectly centered music note: staff stem at x=168, notehead at bottom, flag on top-right -->
  <!-- Stem: vertical bar -->
  <rect x="168" y="130" width="36" height="220" rx="18" fill="white"/>
  <!-- Top horizontal beam connecting to second note -->
  <rect x="168" y="130" width="172" height="36" rx="18" fill="white"/>
  <!-- Second stem -->
  <rect x="304" y="130" width="36" height="185" rx="18" fill="white"/>
  <!-- Left note head (filled circle) -->
  <ellipse cx="162" cy="352" rx="52" ry="40" fill="white"/>
  <!-- Right note head (filled circle) -->
  <ellipse cx="298" cy="316" rx="52" ry="40" fill="white"/>
</svg>
