<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wave — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 1.5rem;
      display: block;
      animation: pulse 2s ease-in-out infinite;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: rgba(235,235,245,0.6); font-size: 0.9rem; line-height: 1.6; max-width: 280px; margin: 0 auto 2rem; }
    button {
      background: #fc3c44;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button:active { transform: scale(0.97); }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div>
    <span class="icon">🎵</span>
    <h1>You're Offline</h1>
    <p>Wave Music needs an internet connection to stream music and podcasts. Please check your connection.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
